<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Wishlist — CloudCart</title>
  <meta name="description" content="Your saved CloudCart hardware pieces. Track availability and move items directly to your shopping bag." />
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="wishlist">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-shell">
    <header id="site-header"></header>

    <main id="main" class="main-content">
      <div class="container">
        <header class="page-hero">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
            <div>
              <p class="section__kicker"><i data-lucide="heart" style="width:14px;height:14px;display:inline-block;vertical-align:middle;color:#ff3b69;fill:#ff3b69;"></i> Saved Hardware</p>
              <h1>Studio Wishlist</h1>
              <p class="lede">Your personal hardware vault. Review saved items, inspect real-time inventory telemetry, or transfer everything directly to your bag.</p>
            </div>
            <div id="wishlist-toolbar-actions" style="display:flex;gap:12px;align-items:center;">
              <button class="btn btn--cyan btn--small" id="btn-move-all-bag" type="button">
                <i data-lucide="shopping-bag"></i> Move All to Bag
              </button>
              <button class="btn btn--ghost btn--small" id="btn-clear-wishlist" type="button">
                <i data-lucide="trash-2"></i> Clear
              </button>
            </div>
          </div>
        </header>

        <!-- Wishlist Content Area -->
        <div id="wishlist-container">
          <div class="skeleton-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" id="site-footer"></footer>
  </div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
